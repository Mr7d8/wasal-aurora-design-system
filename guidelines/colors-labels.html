<!-- @dsCard group="Colors" viewport="700x150" subtitle="Darkened accents for small uppercase type" name="Label variants" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:22px;font-family:var(--font-body);background:var(--paper);color:var(--body)}
.row{display:flex;gap:14px;align-items:stretch}.col{display:flex;flex-direction:column;gap:6px}
.sw{flex:1;border-radius:16px;height:74px}.lbl{font-size:13px;font-weight:700;color:var(--ink)}.hex{font-size:12px;letter-spacing:.4px}
</style></head><body><div class="col" style="gap:12px">
<div class="row" style="gap:26px;flex-wrap:wrap">
<span style="font-size:15px;font-weight:600;letter-spacing:3px;text-transform:uppercase;color:var(--violet-label)">Violet 7B5CFF</span>
<span style="font-size:15px;font-weight:600;letter-spacing:3px;text-transform:uppercase;color:var(--pink-label)">Pink FF4FA3</span>
<span style="font-size:15px;font-weight:600;letter-spacing:3px;text-transform:uppercase;color:var(--coral-label)">Coral D4521C</span>
<span style="font-size:15px;font-weight:600;letter-spacing:3px;text-transform:uppercase;color:var(--mint-label)">Mint 1E9A66</span>
<span style="font-size:15px;font-weight:600;letter-spacing:3px;text-transform:uppercase;color:var(--sky-label)">Sky 1F6FD6</span>
</div>
<span style="font-size:13px">Coral, mint and sky are darkened for eyebrow-scale type so contrast holds on the near-white ground.</span>
</div></body></html>
