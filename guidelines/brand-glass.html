<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:22px;font-family:var(--font-body);background:var(--paper);color:var(--body)}
.row{display:flex;gap:14px;align-items:stretch}.col{display:flex;flex-direction:column;gap:6px}
.sw{flex:1;border-radius:16px;height:74px}.lbl{font-size:13px;font-weight:700;color:var(--ink)}.hex{font-size:12px;letter-spacing:.4px}
</style></head><body><div style="background:url(../assets/bg-aurora.png) center/cover no-repeat,var(--paper);border-radius:20px;padding:20px">
<div style="background:var(--surface-card);backdrop-filter:blur(var(--blur-glass));-webkit-backdrop-filter:blur(var(--blur-glass));border:1px solid var(--border-card);border-radius:var(--radius-card);box-shadow:var(--shadow-card);padding:20px 24px;display:flex;flex-direction:column;gap:10px">
<span style="font-size:16px;font-weight:700;color:var(--ink)">White at 55 percent, blur 26px</span>
<span style="font-size:13px;line-height:1.5">1px white rim, radius 26px, soft violet shadow. Floats over the aurora with room around it.</span>
