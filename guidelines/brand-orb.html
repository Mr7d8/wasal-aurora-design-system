<!-- @dsCard group="Brand" viewport="700x230" subtitle="Blurred conic wash under a lit sphere" name="Gradient orb" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:22px;font-family:var(--font-body);background:var(--paper);color:var(--body)}
.row{display:flex;gap:14px;align-items:stretch}.col{display:flex;flex-direction:column;gap:6px}
.sw{flex:1;border-radius:16px;height:74px}.lbl{font-size:13px;font-weight:700;color:var(--ink)}.hex{font-size:12px;letter-spacing:.4px}
</style></head><body><div style="position:relative;border-radius:20px;height:190px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:var(--paper)">
<div style="position:absolute;width:250px;height:250px;border-radius:50%;background:conic-gradient(from 205deg,var(--orb-1),var(--orb-2),var(--orb-3),var(--orb-4),var(--orb-1));filter:blur(38px);opacity:.75"></div>
<div style="position:relative;width:150px;height:150px;border-radius:50%;background:radial-gradient(circle at 30% 22%,rgba(255,255,255,.92),rgba(255,255,255,.18) 38%,rgba(255,255,255,0) 58%),conic-gradient(from 195deg,#A8C8FF,#EEC4FF,#FFC9A8,#C8B4FF,#A8C8FF);box-shadow:inset 0 -24px 44px rgba(255,255,255,.75),inset 0 16px 32px rgba(255,255,255,.5),var(--shadow-orb)"></div>
</div></body></html>
