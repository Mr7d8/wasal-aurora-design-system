<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:22px;font-family:var(--font-body);background:var(--paper);color:var(--body)}
.row{display:flex;gap:14px;align-items:stretch}.col{display:flex;flex-direction:column;gap:6px}
.sw{flex:1;border-radius:16px;height:74px}.lbl{font-size:13px;font-weight:700;color:var(--ink)}.hex{font-size:12px;letter-spacing:.4px}
</style></head><body><div class="row">
<div class="col" style="flex:1"><div class="sw" style="background:var(--violet)"></div><span class="lbl">Violet</span><span class="hex">#7B5CFF</span></div><div class="col" style="flex:1"><div class="sw" style="background:var(--pink)"></div><span class="lbl">Hot pink</span><span class="hex">#FF4FA3</span></div><div class="col" style="flex:1"><div class="sw" style="background:var(--coral)"></div><span class="lbl">Coral</span><span class="hex">#FF7A45</span></div><div class="col" style="flex:1"><div class="sw" style="background:var(--mint)"></div><span class="lbl">Mint</span><span class="hex">#3FCF8E</span></div><div class="col" style="flex:1"><div class="sw" style="background:var(--sky)"></div><span class="lbl">Sky</span><span class="hex">#3E9BFF</span></div>
</div></body></html>
