<!-- @dsCard group="Type" viewport="700x200" subtitle="Every deck size token in one column" name="Scale" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:22px;font-family:var(--font-body);background:var(--paper);color:var(--body)}
.row{display:flex;gap:14px;align-items:stretch}.col{display:flex;flex-direction:column;gap:6px}
.sw{flex:1;border-radius:16px;height:74px}.lbl{font-size:13px;font-weight:700;color:var(--ink)}.hex{font-size:12px;letter-spacing:.4px}
</style></head><body><div class="col" style="gap:8px;font-size:14px">
<div style="display:flex;justify-content:space-between;border-bottom:1px solid var(--rule-hairline);padding:6px 0"><span>Divider phrase</span><b style="color:var(--ink)">132px / 800</b></div>
<div style="display:flex;justify-content:space-between;border-bottom:1px solid var(--rule-hairline);padding:6px 0"><span>Cover headline</span><b style="color:var(--ink)">104px / 800</b></div>
<div style="display:flex;justify-content:space-between;border-bottom:1px solid var(--rule-hairline);padding:6px 0"><span>Slide headline</span><b style="color:var(--ink)">64 to 76px / 800</b></div>
<div style="display:flex;justify-content:space-between;border-bottom:1px solid var(--rule-hairline);padding:6px 0"><span>KPI number</span><b style="color:var(--ink)">104px / 800</b></div>
<div style="display:flex;justify-content:space-between;border-bottom:1px solid var(--rule-hairline);padding:6px 0"><span>Card title</span><b style="color:var(--ink)">40px / 700</b></div>
<div style="display:flex;justify-content:space-between;border-bottom:1px solid var(--rule-hairline);padding:6px 0"><span>Body</span><b style="color:var(--ink)">29 to 34px / 400</b></div>
<div style="display:flex;justify-content:space-between;padding:6px 0"><span>Eyebrow</span><b style="color:var(--ink)">24px / 600</b></div>
</div></body></html>
