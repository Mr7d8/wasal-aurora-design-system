<!-- @dsCard group="Colors" viewport="700x170" subtitle="Headline ink, body grey, near-white ground" name="Ink and paper" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:22px;font-family:var(--font-body);background:var(--paper);color:var(--body)}
.row{display:flex;gap:14px;align-items:stretch}.col{display:flex;flex-direction:column;gap:6px}
.sw{flex:1;border-radius:16px;height:74px}.lbl{font-size:13px;font-weight:700;color:var(--ink)}.hex{font-size:12px;letter-spacing:.4px}
</style></head><body><div class="row">
<div class="col" style="flex:1"><div class="sw" style="background:var(--ink)"></div><span class="lbl">Ink, headlines</span><span class="hex">#111114</span></div><div class="col" style="flex:1"><div class="sw" style="background:var(--body)"></div><span class="lbl">Body text</span><span class="hex">#4A4A55</span></div><div class="col" style="flex:1"><div class="sw" style="background:var(--paper)"></div><span class="lbl">Paper</span><span class="hex">#FFFDFD</span></div><div class="col" style="flex:1"><div class="sw" style="background:var(--white)"></div><span class="lbl">Card white</span><span class="hex">#FFFFFF</span></div>
</div></body></html>
