<!-- @dsCard group="Slides" viewport="1280x720" subtitle="Gradient headline left, device visual right" name="Title slide" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}
.slide{width:1920px;height:1080px;transform:scale(.6667);transform-origin:top left;background:url(../assets/bg-aurora.png) center/cover no-repeat,#FFFDFD;font-family:var(--font-display);color:var(--body);display:flex;flex-direction:column;box-sizing:border-box}
h1,h2{margin:0;color:var(--ink);letter-spacing:var(--tracking-headline);line-height:var(--leading-headline);font-weight:800}
.grad{background:var(--gradient-headline);-webkit-background-clip:text;background-clip:text;color:transparent}
.eb{font-size:24px;font-weight:600;letter-spacing:3px;text-transform:uppercase}
.glass{background:var(--surface-card);backdrop-filter:blur(var(--blur-glass));border:1px solid var(--border-card);border-radius:var(--radius-card);box-shadow:var(--shadow-card)}
.logo{width:150px;height:auto}
body{width:1280px;height:720px;overflow:hidden}
</style></head><body><div class="slide">
<div style="flex:1;display:flex;align-items:center;gap:90px;padding:100px 104px">
  <div style="flex:1.15;display:flex;flex-direction:column;gap:44px">
    <img class="logo" src="../assets/wasal-logo.png" alt="wasal" style="width:216px">
    <h1 style="font-size:104px;letter-spacing:-3px;line-height:.98">Working With AI, <span class="grad">Not Just Asking It Questions</span></h1>
    <p style="margin:0;font-size:34px;line-height:1.5;max-width:780px">A practical look at how Claude can boost the team's output.</p>
    <div style="display:flex;align-items:center;gap:20px">
      <div style="width:6px;height:74px;border-radius:4px;background:linear-gradient(180deg,#FF4FA3,#7B5CFF)"></div>
      <div style="display:flex;flex-direction:column;gap:6px"><span style="font-size:30px;font-weight:700;color:var(--ink)">Ossama Haddioui</span><span style="font-size:26px">Growth Marketing Manager</span></div>
    </div>
  </div>
  <div style="flex:.95;position:relative;height:820px;display:flex;align-items:center;justify-content:center">
    <span style="position:absolute;top:30px;font-size:210px;font-weight:800;letter-spacing:-9px;color:rgba(17,17,20,.05);line-height:1">wasal</span>
    <div style="position:absolute;width:600px;height:600px;border-radius:50%;background:conic-gradient(from 210deg,var(--orb-1),var(--orb-2),var(--orb-3),var(--orb-4),var(--orb-1));filter:blur(66px);opacity:.5"></div>
    <div style="position:relative;width:380px;height:780px;border-radius:54px;background:linear-gradient(150deg,#2A2A33,#14141A);padding:12px;box-shadow:var(--shadow-device);transform:rotate(-4deg)">
      <div style="width:100%;height:100%;border-radius:44px;background:#fff;overflow:hidden;display:flex;flex-direction:column;padding:24px 22px;gap:18px">
        <div style="align-self:center;width:110px;height:24px;border-radius:13px;background:#14141A"></div>
        <img src="../assets/wasal-logo.png" alt="wasal" style="width:104px;height:auto">
        <span style="font-size:32px;font-weight:700;color:var(--ink)">This morning, 07:00</span>
        <div style="display:flex;gap:12px">
          <div style="flex:1;border-radius:18px;background:var(--mint-tint);padding:18px 16px"><div style="font-size:36px;font-weight:800;color:#3FCF8E;letter-spacing:-1px">+18%</div><div style="font-size:24px">ROAS</div></div>
          <div style="flex:1;border-radius:18px;background:var(--sky-tint);padding:18px 16px"><div style="font-size:36px;font-weight:800;color:#3E9BFF;letter-spacing:-1px">9.4k</div><div style="font-size:24px">Sessions</div></div>
        </div>
        <div style="flex:1;border-radius:20px;background:var(--gradient-panel);padding:20px;display:flex;align-items:flex-end;gap:10px">
          <div style="flex:1;height:44%;border-radius:8px;background:#7B5CFF"></div><div style="flex:1;height:72%;border-radius:8px;background:#FF4FA3"></div><div style="flex:1;height:58%;border-radius:8px;background:#3E9BFF"></div><div style="flex:1;height:92%;border-radius:8px;background:#FF7A45"></div><div style="flex:1;height:36%;border-radius:8px;background:#3FCF8E"></div>
        </div>
      </div>
    </div>
    <div class="glass" style="position:absolute;top:80px;left:-10px;background:var(--surface-card-strong);box-shadow:var(--shadow-card-float);padding:18px 24px;display:flex;flex-direction:column;gap:4px;border-radius:24px">
      <span style="font-size:32px;font-weight:800;color:#FF4FA3;letter-spacing:-1px">47 k</span><span style="font-size:24px;font-weight:600;color:var(--ink)">Followers</span>
    </div>
    <div class="glass" style="position:absolute;bottom:130px;left:-30px;background:var(--surface-card-strong);box-shadow:var(--shadow-card-float);padding:18px 24px;display:flex;align-items:center;gap:14px;border-radius:24px">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#1E9A66" stroke-width="1.6" stroke-linecap="round"><path d="M13 3L5 14h6l-1 7 8-11h-6z"/></svg>
      <span style="font-size:24px;font-weight:600;color:var(--ink)">Sent automatically</span>
    </div>
  </div>
</div></div></body></html>
