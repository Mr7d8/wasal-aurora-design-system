<!-- @dsCard group="Slides" viewport="1280x720" subtitle="One chart, labels on the chart" name="Chart slide" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}
.slide{width:1920px;height:1080px;transform:scale(.6667);transform-origin:top left;background:url(../assets/bg-aurora.png) center/cover no-repeat,#FFFDFD;font-family:var(--font-display);color:var(--body);display:flex;flex-direction:column;box-sizing:border-box}
h1,h2{margin:0;color:var(--ink);letter-spacing:var(--tracking-headline);line-height:var(--leading-headline);font-weight:800}
.grad{background:var(--gradient-headline);-webkit-background-clip:text;background-clip:text;color:transparent}
.eb{font-size:24px;font-weight:600;letter-spacing:3px;text-transform:uppercase}
.glass{background:var(--surface-card);backdrop-filter:blur(var(--blur-glass));border:1px solid var(--border-card);border-radius:var(--radius-card);box-shadow:var(--shadow-card)}
.logo{width:150px;height:auto}
body{width:1280px;height:720px;overflow:hidden}
</style></head><body><div class="slide">
<div style="flex:1;display:flex;flex-direction:column;padding:76px 104px">
  <div style="display:flex;justify-content:space-between;align-items:flex-start">
    <img class="logo" src="../assets/wasal-logo.png" alt="wasal">
    <span class="eb" style="color:var(--violet-label)">Conversion</span>
  </div>
  <h2 style="margin-top:34px;font-size:64px;max-width:1150px">Where the funnel <span style="color:var(--violet-label)">loses people</span></h2>
  <div class="glass" style="flex:1;margin-top:48px;padding:56px 60px;display:flex;flex-direction:column;gap:22px;justify-content:center">
    <div style="display:flex;align-items:center;gap:26px"><div style="width:100%;height:56px;border-radius:28px;background:#7B5CFF;display:flex;align-items:center;padding-left:26px"><span style="font-size:29px;font-weight:700;color:var(--ink)">9 400</span></div><span style="font-size:29px">Sessions</span></div><div style="display:flex;align-items:center;gap:26px"><div style="width:54%;height:56px;border-radius:28px;background:#FF4FA3;display:flex;align-items:center;padding-left:26px"><span style="font-size:29px;font-weight:700;color:var(--ink)">5 100</span></div><span style="font-size:29px">Product view</span></div><div style="display:flex;align-items:center;gap:26px"><div style="width:23%;height:56px;border-radius:28px;background:#FF7A45;display:flex;align-items:center;padding-left:26px"><span style="font-size:29px;font-weight:700;color:var(--ink)">2 200</span></div><span style="font-size:29px">Cart</span></div><div style="display:flex;align-items:center;gap:26px"><div style="width:14%;height:56px;border-radius:28px;background:#3FCF8E;display:flex;align-items:center;padding-left:26px"><span style="font-size:29px;font-weight:700;color:var(--ink)">840</span></div><span style="font-size:29px">Order</span></div>
  </div>
  <p style="margin:34px 0 0;font-size:29px">Funnel chosen because the data shows how one total splits down a path.</p>
</div></div></body></html>
