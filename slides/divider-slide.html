<!-- @dsCard group="Slides" viewport="1280x720" subtitle="One large gradient phrase" name="Section divider" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}
.slide{width:1920px;height:1080px;transform:scale(.6667);transform-origin:top left;background:url(../assets/bg-aurora.png) center/cover no-repeat,#FFFDFD;font-family:var(--font-display);color:var(--body);display:flex;flex-direction:column;box-sizing:border-box}
h1,h2{margin:0;color:var(--ink);letter-spacing:var(--tracking-headline);line-height:var(--leading-headline);font-weight:800}
.grad{background:var(--gradient-headline);-webkit-background-clip:text;background-clip:text;color:transparent}
.eb{font-size:24px;font-weight:600;letter-spacing:3px;text-transform:uppercase}
.glass{background:var(--surface-card);backdrop-filter:blur(var(--blur-glass));border:1px solid var(--border-card);border-radius:var(--radius-card);box-shadow:var(--shadow-card)}
.logo{width:150px;height:auto}
body{width:1280px;height:720px;overflow:hidden}
</style></head><body><div class="slide">
<div style="flex:1;display:flex;flex-direction:column;justify-content:center;gap:40px;padding:100px 140px">
  <span class="eb" style="font-size:26px;letter-spacing:4px;color:var(--violet-label)">Part 1</span>
  <h2 class="grad" style="font-size:132px;line-height:.96;letter-spacing:-4px">Proof, not theory</h2>
  <p style="margin:0;font-size:34px;line-height:1.5;max-width:1000px">Everything on the next slides is already running inside Wasal. No pilot, no vendor promise, built and used daily.</p>
</div></div></body></html>
