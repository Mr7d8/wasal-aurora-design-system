<!-- @dsCard group="Slides" viewport="1280x720" subtitle="Centered gradient punch line" name="Closing slide" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}
.slide{width:1920px;height:1080px;transform:scale(.6667);transform-origin:top left;background:url(../assets/bg-aurora.png) center/cover no-repeat,#FFFDFD;font-family:var(--font-display);color:var(--body);display:flex;flex-direction:column;box-sizing:border-box}
h1,h2{margin:0;color:var(--ink);letter-spacing:var(--tracking-headline);line-height:var(--leading-headline);font-weight:800}
.grad{background:var(--gradient-headline);-webkit-background-clip:text;background-clip:text;color:transparent}
.eb{font-size:24px;font-weight:600;letter-spacing:3px;text-transform:uppercase}
.glass{background:var(--surface-card);backdrop-filter:blur(var(--blur-glass));border:1px solid var(--border-card);border-radius:var(--radius-card);box-shadow:var(--shadow-card)}
.logo{width:150px;height:auto}
body{width:1280px;height:720px;overflow:hidden}
</style></head><body><div class="slide">
<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:100px 140px">
  <img src="../assets/wasal-logo.png" alt="wasal" style="width:168px;height:auto;margin-bottom:54px">
  <span class="eb" style="font-size:26px;letter-spacing:4px;color:var(--violet-label)">Next step</span>
  <h2 class="grad" style="margin-top:30px;font-size:118px;line-height:.98;letter-spacing:-4px;background:linear-gradient(90deg,#FF7A45,#FF4FA3 45%,#7B5CFF);-webkit-background-clip:text;background-clip:text">One pilot per team</h2>
  <p style="margin:42px 0 0;font-size:36px;line-height:1.5;max-width:1150px">Each function picks one recurring task to hand to AI this month. Check back in three weeks with results.</p>
</div></div></body></html>
