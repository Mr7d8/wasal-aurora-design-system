<!-- @dsCard group="Components" viewport="700x330" subtitle="Icon chips, eyebrows, gradient type, pills" name="Primitives" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>body{margin:0;padding:22px;font-family:var(--font-body);color:var(--body);background:url(../../assets/bg-aurora.png) center/cover no-repeat,var(--paper);display:flex;flex-direction:column;gap:20px}</style></head><body>
<div style="display:flex;gap:14px">
  <div style="width:52px;height:52px;border-radius:var(--radius-chip);background:var(--violet-tint);display:flex;align-items:center;justify-content:center"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#7B5CFF" stroke-width="1.5" stroke-linecap="round"><path d="M4 19V5"/><path d="M4 19h16"/><path d="M8 16v-4"/><path d="M13 16V8"/><path d="M18 16v-7"/></svg></div>
  <div style="width:52px;height:52px;border-radius:var(--radius-chip);background:var(--pink-tint);display:flex;align-items:center;justify-content:center"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#FF4FA3" stroke-width="1.5" stroke-linecap="round"><rect x="4" y="4" width="16" height="16" rx="4.5"/><circle cx="12" cy="12" r="3.5"/></svg></div>
  <div style="width:52px;height:52px;border-radius:var(--radius-chip);background:var(--coral-tint);display:flex;align-items:center;justify-content:center"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#FF7A45" stroke-width="1.5" stroke-linecap="round"><path d="M12 21s6.5-6.2 6.5-11A6.5 6.5 0 0 0 5.5 10c0 4.8 6.5 11 6.5 11z"/><circle cx="12" cy="10" r="2.4"/></svg></div>
  <div style="width:52px;height:52px;border-radius:var(--radius-chip);background:var(--mint-tint);display:flex;align-items:center;justify-content:center"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#3FCF8E" stroke-width="1.5" stroke-linecap="round"><path d="M4 12.5l5 5L20 6.5"/></svg></div>
  <div style="width:52px;height:52px;border-radius:var(--radius-chip);background:var(--sky-tint);display:flex;align-items:center;justify-content:center"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#3E9BFF" stroke-width="1.5" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg></div>
  <div style="display:flex;flex-direction:column;justify-content:center;gap:6px;margin-left:10px">
    <span style="font-size:14px;font-weight:600;letter-spacing:3px;text-transform:uppercase;color:var(--violet-label)">Running today</span>
    <span style="font-size:14px;font-weight:600;letter-spacing:3px;text-transform:uppercase;color:var(--mint-label)">Decisions</span>
  </div>
</div>
<span style="font-size:42px;font-weight:800;letter-spacing:-1.5px;line-height:1.02;background:var(--gradient-headline);-webkit-background-clip:text;background-clip:text;color:transparent">Starting this week</span>
<div style="display:flex;gap:10px;flex-wrap:wrap">
  <span style="font-size:14px;font-weight:600;color:var(--ink);background:var(--violet-tint);border-radius:var(--radius-pill);padding:12px 22px">Pulling data</span>
  <span style="font-size:14px;font-weight:600;color:var(--ink);background:var(--pink-tint);border-radius:var(--radius-pill);padding:12px 22px">Formatting reports</span>
  <span style="font-size:14px;font-weight:600;color:var(--ink);background:var(--sky-tint);border-radius:var(--radius-pill);padding:12px 22px">Building decks</span>
  <span style="font-size:14px;font-weight:600;color:var(--ink);background:var(--mint-tint);border-radius:var(--radius-pill);padding:12px 22px">First drafts</span>
</div>
</body></html>
