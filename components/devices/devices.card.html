<!-- @dsCard group="Components" viewport="700x430" subtitle="Hero stage, phone and laptop frames, floating cards" name="Devices" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>body{margin:0;font-family:var(--font-body);color:var(--body);background:linear-gradient(160deg,#F3F6FF,#FFF3F9 45%,#FFF7EF);height:430px;overflow:hidden}
.stage{position:relative;height:100%;display:flex;align-items:center;justify-content:center}
.glass{position:absolute;background:var(--surface-card-strong);backdrop-filter:blur(var(--blur-glass));border:1px solid var(--border-card);box-shadow:var(--shadow-card-float);border-radius:20px;padding:12px 16px;display:flex;align-items:center;gap:10px}
</style></head><body>
<div class="stage">
  <span style="position:absolute;top:18px;left:50%;transform:translateX(-50%);font-size:140px;font-weight:800;letter-spacing:-7px;color:rgba(17,17,20,.05);line-height:1">wasal</span>
  <div style="position:absolute;width:360px;height:360px;border-radius:50%;background:conic-gradient(from 210deg,var(--orb-1),var(--orb-2),var(--orb-3),var(--orb-4),var(--orb-1));filter:blur(40px);opacity:.5"></div>
  <div style="position:relative;width:184px;height:372px;border-radius:32px;background:linear-gradient(150deg,#2A2A33,#14141A);padding:7px;box-shadow:var(--shadow-device);transform:rotate(-4deg)">
    <div style="width:100%;height:100%;border-radius:26px;background:#fff;overflow:hidden;display:flex;flex-direction:column;padding:12px 11px;gap:9px">
      <div style="align-self:center;width:52px;height:12px;border-radius:7px;background:#14141A"></div>
      <img src="../../assets/wasal-logo.png" alt="wasal" style="width:56px;height:auto">
      <div style="height:20px;border-radius:10px;background:rgba(17,17,20,.05)"></div>
      <div style="display:flex;gap:6px"><div style="flex:1;height:34px;border-radius:10px;background:linear-gradient(150deg,#FFD9EC,#E0D4FF)"></div><div style="flex:1;height:34px;border-radius:10px;background:linear-gradient(150deg,#DCEBFF,#D9F5EA)"></div><div style="flex:1;height:34px;border-radius:10px;background:linear-gradient(150deg,#FFE9D8,#FFD9EC)"></div></div>
      <div style="flex:1;border-radius:14px;background:linear-gradient(160deg,#FFD9EC,#C3A9FF)"></div>
      <div style="display:flex;gap:6px"><div style="flex:1;height:44px;border-radius:12px;background:rgba(17,17,20,.05)"></div><div style="flex:1;height:44px;border-radius:12px;background:rgba(17,17,20,.05)"></div></div>
    </div>
  </div>
  <div class="glass" style="top:76px;left:110px;flex-direction:column;align-items:flex-start;gap:2px">
    <span style="font-size:20px;font-weight:800;color:#FF4FA3;letter-spacing:-.5px">47 k</span>
    <span style="font-size:11px;font-weight:600;color:var(--ink)">Followers</span>
  </div>
  <div class="glass" style="top:186px;right:104px">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#7B5CFF" stroke-width="1.6" stroke-linecap="round"><path d="M12 20s-7-4.4-7-9.2A4 4 0 0 1 12 8a4 4 0 0 1 7 2.8C19 15.6 12 20 12 20z"/></svg>
    <span style="font-size:11px;font-weight:600;color:var(--ink)">Moment saved</span>
  </div>
  <div class="glass" style="bottom:66px;left:96px">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1E9A66" stroke-width="1.6" stroke-linecap="round"><path d="M4 16l5-5 4 3 6-7"/><path d="M15 7h4v4"/></svg>
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1F6FD6" stroke-width="1.6" stroke-linecap="round"><path d="M20 12a8 8 0 1 1-3.3-6.5"/><path d="M4 20l1.6-4.2"/></svg>
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#D4521C" stroke-width="1.6" stroke-linecap="round"><path d="M21 4L3 11l6 2 2 6z"/></svg>
  </div>
</div>
</body></html>
